name: astrbot_all_search
display_name: 多引擎网页与图片搜索（必应/百度/哔哩哔哩）
short_desc: 在必应、百度、哔哩哔哩搜索网页与视频，并搜索转发图片
desc: >
  独立 AstrBot 插件：支持必应、百度、哔哩哔哩三个引擎的网页与视频搜索，
  不指定引擎时并发搜索全部已启用引擎并合并结果；哔哩哔哩返回视频直链与视频简介。
  图片搜索支持必应、百度与哔哩哔哩（后者从视频封面与专栏图文配图获取）。
  命令统一为 /搜索 /搜图（英文兼容 /search /image），
  可在关键词前显式指定引擎（如 /搜索 百度 关键词）。网页与图片是两项独立能力，
  图片在工具调用期间由插件直接发送到当前会话，AI 只收到不含图片直链的文字回执。
  失败时日志与回执只记录稳定错误码，不泄密；百度被拦截时引导配置 Cookies。
version: 2.0.1
author: kimyoung666
repo: https://github.com/kimyoung666/astrbot_all_search
astrbot_version: ">=4.26.7"
support_platforms:
  - aiocqhttp
